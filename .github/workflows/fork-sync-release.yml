name: Fork sync and Windows release

# Fork-only automation: merge pingdotgg/t3code main into this branch every day,
# then build an unsigned Windows installer from the result and publish it as a
# nightly GitHub Release of this fork. The installed app polls that release
# feed (electron-updater), so it updates itself.
#
# Upstream's own workflows are never merged in: pushing workflow files needs a
# token scope GITHUB_TOKEN lacks, and they target maintainer infrastructure.

on:
  schedule:
    # Avoid minute zero, when GitHub scheduled jobs are busiest.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: Build and publish even when upstream has nothing new
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fork-sync-release
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: merge
        name: Merge upstream/main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --no-commit --no-ff upstream/main || true
          # Keep this fork's workflows exactly as they are.
          git reset -q HEAD -- .github/workflows
          git checkout -- .github/workflows
          git clean -fdq -- .github/workflows

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "::error::Merge conflicts with upstream/main. Resolve locally: git fetch upstream && git merge upstream/main"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git commit -q -m "chore: sync upstream $(git rev-parse --short upstream/main)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    name: Build Windows installer
    needs: sync
    if: ${{ needs.sync.outputs.changed == 'true' || inputs.force_build }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) { exit 1 }

      - id: release_meta
        name: Resolve nightly version
        shell: bash
        run: |
          node scripts/resolve-nightly-release.ts \
            --date "$(date -u +%Y%m%d)" \
            --run-number "${GITHUB_RUN_NUMBER}" \
            --sha "$(git rev-parse HEAD)" \
            --github-output

      - name: Align package versions
        shell: bash
        run: node scripts/update-release-package-versions.ts "${{ steps.release_meta.outputs.version }}"

      - name: Build JS bundle
        run: vp run build:desktop

      - name: Package installer
        shell: bash
        run: >
          vp run dist:desktop:artifact
          --platform win --target nsis --arch x64
          --build-version "${{ steps.release_meta.outputs.version }}"
          --skip-build --verbose

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(release/*.exe release/*.exe.blockmap release/nightly*.yml)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "::error::No installer artifacts were produced." >&2
            ls -la release || true
            exit 1
          fi
          gh release create "${{ steps.release_meta.outputs.tag }}" "${assets[@]}" \
            --target "${{ needs.sync.outputs.sha }}" \
            --title "DeepSeek Harness fork ${{ steps.release_meta.outputs.version }}" \
            --notes "Automated Windows build of the fork (unsigned). Upstream merged through ${{ needs.sync.outputs.sha }}." \
            --prerelease
